services:
  - type: web
    name: weedeliver-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: STITCH_CLIENT_ID
        sync: false
      - key: STITCH_CLIENT_SECRET
        sync: false
      - key: STITCH_WEBHOOK_SECRET
        sync: false
      - key: STITCH_BENEFICIARY_NAME
        sync: false
      - key: STITCH_BENEFICIARY_BANK_ID
        sync: false
      - key: STITCH_BENEFICIARY_ACCOUNT_NUMBER
        sync: false
